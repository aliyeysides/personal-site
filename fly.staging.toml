# fly.staging.toml - Staging environment for aliyeysides
#
# Deploy with: fly deploy --config fly.staging.toml
#

app = "aliyeysides-staging"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[build.args]
  BP_KEEP_FILES = "assets/*:resources/*"
